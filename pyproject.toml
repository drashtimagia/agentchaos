[project]
name = "agentchaos"
version = "0.1.0.dev0"
description = "Chaos engineering for AI agents: inject tool failures, score resilience."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.29.2",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
claude = [
    "anthropic==2.10.0",
    "claude-agent-sdk==0.2.184",
]

[project.scripts]
agentchaos = "agentchaos.cli:app"

[project.entry-points."agentchaos.faults"]
timeout = "agentchaos.core.faults:Timeout"
rate_limit = "agentchaos.core.faults:RateLimit"
fail_after = "agentchaos.core.faults:FailAfter"
error_mid_task = "agentchaos.core.faults:ErrorMidTask"
latency = "agentchaos.core.faults:Latency"
malformed_json = "agentchaos.core.faults:MalformedJSON"
stale_data = "agentchaos.core.faults:StaleData"
schema_drift = "agentchaos.core.faults:SchemaDrift"

[project.entry-points."agentchaos.scenarios"]
ticketing = "agentchaos.scenarios.tasks.ticketing:TicketingScenario"
bank_transfer = "agentchaos.scenarios.tasks.bank_transfer:BankTransferScenario"
search_summarize = "agentchaos.scenarios.tasks.search_summarize:SearchSummarizeScenario"
file_edit = "agentchaos.scenarios.tasks.file_edit:FileEditScenario"
inventory = "agentchaos.scenarios.tasks.inventory:InventoryScenario"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
