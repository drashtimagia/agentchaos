[project]
name = "agentchaos"
version = "0.1.0"
description = "Chaos engineering for AI agents: inject tool failures, score resilience."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
keywords = ["chaos-engineering", "ai-agents", "testing", "fault-injection", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    "mcp==2.3.0",
    "mcp-types==2.3.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "typer==0.29.2",
    "uvicorn==0.54.0",
]

[project.urls]
Homepage = "https://github.com/drashtimagia/agentchaos"
Repository = "https://github.com/drashtimagia/agentchaos"
Issues = "https://github.com/drashtimagia/agentchaos/issues"
Changelog = "https://github.com/drashtimagia/agentchaos/releases"

[project.optional-dependencies]
claude = [
    "anthropic==2.10.0",
    "claude-agent-sdk==0.2.184",
]
openai = [
    "openai-agents>=0.0.19",
]
langgraph = [
    "langgraph>=0.3.0",
    "langchain-openai>=0.3.0",
]
otel = [
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27.0",
]
pytest = [
    "pytest>=7.0",
]

[project.scripts]
agentchaos = "agentchaos.cli:app"

[project.entry-points."pytest11"]
agentchaos = "agentchaos.pytest_plugin"

[project.entry-points."agentchaos.faults"]
timeout = "agentchaos.core.faults:Timeout"
rate_limit = "agentchaos.core.faults:RateLimit"
fail_after = "agentchaos.core.faults:FailAfter"
error_mid_task = "agentchaos.core.faults:ErrorMidTask"
latency = "agentchaos.core.faults:Latency"
malformed_json = "agentchaos.core.faults:MalformedJSON"
stale_data = "agentchaos.core.faults:StaleData"
schema_drift = "agentchaos.core.faults:SchemaDrift"

[project.entry-points."agentchaos.scenarios"]
ticketing = "agentchaos.scenarios.tasks.ticketing:TicketingScenario"
bank_transfer = "agentchaos.scenarios.tasks.bank_transfer:BankTransferScenario"
search_summarize = "agentchaos.scenarios.tasks.search_summarize:SearchSummarizeScenario"
file_edit = "agentchaos.scenarios.tasks.file_edit:FileEditScenario"
inventory = "agentchaos.scenarios.tasks.inventory:InventoryScenario"

[tool.hatch.build.targets.wheel]
packages = ["agentchaos"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-xdist==3.8.0",
    "ruff==0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
